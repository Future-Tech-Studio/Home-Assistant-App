configuration:
  device_alarm_webhook:
    name: Device Alarm UniFi Webhook
    description: UniFi Protect DeviceAlarm webhook called once when an enabled device sensor alert starts. Uses the existing Protect API key; sirens and chimes continue until the sensor clears.
  protect_api_key:
    name: Protect API key
    description: API key sent in the X-API-KEY request header.
  entry_delay_seconds:
    name: Entry delay seconds
    description: Seconds between the entry webhook and the Armed Siren webhook.
  armed_away_interior_door_webhook:
    name: Armed Away Interior Door Webhook
    description: UniFi Protect webhook called when a bedroom interior door opens during Armed Away mode.
  armed_stay_kids_interior_door_webhook:
    name: Armed Stay Kids Interior Door Webhook
    description: UniFi Protect webhook called when a bedroom interior door opens during Armed Stay Kids mode.
  beta_mode:
    name: Beta mode
    description: Follows the Beta channel on this installation only: the App offers Beta updates and runs the newest installed Beta build. Turn off to return to Stable.
  github_token:
    name: GitHub access token
    description: Only needed if the Future Homes Tech repository is private. A fine-grained token with read-only Contents access to fht-ha/FHT-HA lets Beta mode check for and download Beta builds.
  protect_verify_ssl:
    name: Verify Protect certificate
    description: Check the UniFi Protect console's TLS certificate. Turn off only for a console with a self-signed certificate you cannot add below.
  protect_ca_certificate:
    name: Protect CA certificate
    description: Path to a trusted certificate file for a Protect console that uses a private certificate authority. Leave blank for a public certificate.
  entry_delay_webhook_id:
    name: Entry delay webhook ID
    description: Leave blank and the App generates a private ID for the Home Assistant webhook that starts the entry-delay countdown.
